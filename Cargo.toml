[package]
name = "mermansi"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
description = "Production-quality pure Rust terminal renderer library and CLI for Mermaid."
license = "MIT OR Apache-2.0"
repository = "https://github.com/kingsword09/mermansi"
keywords = ["mermaid", "diagrams", "terminal", "ascii", "unicode"]
categories = ["visualization", "command-line-utilities"]
exclude = [".aicode/"]

[lib]
name = "mermansi"
path = "src/lib.rs"

[[bin]]
name = "mermansi"
path = "src/bin/mermansi.rs"

[dependencies]
merman-core = { version = "=0.8.0-alpha.3", default-features = false, features = [
    "full",
    "host",
] }
merman-ascii = { version = "=0.8.0-alpha.3", default-features = false, features = [
    "core-full",
    "core-host",
] }
unicode-width = "0.2"
thiserror = "2"
serde_json = "1"
serde = "1"
unicode-segmentation = "1.12"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]

[features]
default = []
