y KISS, YAGNI, DRY, and SOLID and reuse existing bounded Canvas/box primitives only where behavior is genuinely shared."

[[plan.steps]]
id = "step-1"
description = "Inspect existing adapters (Class, Block, Gantt, GitGraph, Packet), dispatch in src/adapters/mod.rs, and box/chart primitives to understand current semantics, Canvas usage, and merman-core model structure."

[[plan.steps]]
id = "step-2"
description = "Implement native Gantt adapter drawing bounded dated timelines with section/task lanes, proportional task bars/milestones, exact labels/date ranges/status flags, and visible ordering."

[[plan.steps]]
id = "step-3"
description = "Implement native GitGraph adapter drawing branch lanes and connected commit nodes with parent links, merges, cherry-picks, commit kinds, ids, messages, tags, current branch, and orientation directions (LR/TB/BT/RL)."

[[plan.steps]]
id = "step-4"
description = "Implement native Packet adapter drawing closed 32-bit word rows with contiguous proportional field rectangles (including multi-row spanning fields), bit ranges, counts, and labels."

[[plan.steps]]
id = "step-5"
description = "Implement native Class adapter drawing closed compartment boxes for classes/interfaces/notes with annotations, members, methods, and namespaces, along with non-crossing or clearly disambiguated relationship routing for endpoint relation kinds, line types, labels, and multi-inheritance."

[[plan.steps]]
id = "step-6"
description = "Clean up Block adapter routing to eliminate duplicated unlabeled text legends, avoid frame-like/disconnected routes for cycles/reverse pairs, and preserve labeled edge visibility."

[[plan.steps]]
id = "step-7"
description = "Update src/adapters/mod.rs to route Gantt, GitGraph, Packet, Class, and Block to native mermansi adapters instead of merman-ascii delegates."

[[plan.steps]]
id = "step-8"
description = "Add comprehensive tests for semantic preservation, box closure, routing, proportionality, direction, bilingual display width, ASCII/Unicode, determinism, and typed resource limits."

[[plan.steps]]
id = "step-9"
description = "Update documentation in AGENTS.md, README.md, and docs/SUPPORT_MATRIX.md to honestly reflect the native adapter additions and capabilities, then run project verification."
