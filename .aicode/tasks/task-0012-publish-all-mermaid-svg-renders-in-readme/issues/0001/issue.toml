description = "Track and embed a complete, named README gallery for all 29 supported fixture families plus four complex scenarios; keep the assets reproducible through the existing real-CLI ASG workflow; clearly explain that they are terminal captures rather than native SVG output; link each family to its source fixture; and add an automated parity check for fixtures, assets, and README references."
