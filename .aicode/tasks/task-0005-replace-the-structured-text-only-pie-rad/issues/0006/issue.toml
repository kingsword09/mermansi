[problem]
description = "The default three-axis fixture renders roughly 46 rows of overlapping graticule dots, spokes, and curve strokes. Configured ticks are silently clamped to 10, total curve-entry count is not bounded before collecting vertex vectors, and curve lines only write into empty cells, so curve identity disappears at spoke/graticule crossings."
impact = "Users cannot reliably distinguish the data curve from the grid, large constructed models can allocate beyond the intended entity accounting, and valid configuration is silently changed."

[acceptance]
description = "Render a compact, legible radar with explicit layer precedence and distinguishable curve strokes/markers; either honor all supported ticks within checked geometry or return a typed limit error; bound total curve entries before allocation; preserve labels/legend options; and add connectivity/readability tests that inspect coordinates and crossings rather than only glyph presence."
command = "cargo test --test semantic_integrity radar_is_compact_readable_and_preserves_configured_ticks -- --exact"
