line = 26

[problem]
description = "A four-point fixture expands to roughly 49 preview rows and nearly 80 columns. Coordinates are used without finite/range validation, label helpers truncate to the canvas without a complete fallback, point-local style semantics are reduced to partial legends, and coincident points are shifted without reliably emitting the promised overlap callout."
impact = "Sparse charts appear chaotic and oversized, while invalid or colliding data can be silently moved, clipped, or omitted from the visual explanation."

[acceptance]
description = "Derive a compact plotting box from data/label extents and bounds; validate or explicitly represent invalid/out-of-range points; preserve every full label and local/class style through in-plot text or callouts; make collision behavior deterministic and truthfully call it out; and add coordinate-aware tests for compactness, closure, all labels, invalid points, and coincident points."
command = "cargo test --test semantic_integrity quadrant_is_compact_and_preserves_every_point_and_label -- --exact"

[resolution]
review = "../../reviews/iteration-0011.json"
description = "Acceptance met by compact dynamic geometry, validated coordinate placement, truthful collision groups, complete label/style fallbacks, exact coordinate-aware tests, visual inspection, and clean full verification."
