[problem]
description = "The English three-set fixture visibly renders overlapping text such as 'ManA∩CmenA∩B'. Subset labels are placed at the arithmetic centroid of set centers without proving that point lies in the requested geometric intersection, and text-node identity is preserved mainly in a trailing summary rather than as a label or connector associated with the region. The canvas also retains large leading/trailing blank areas."
impact = "The diagram is genuinely unreadable and can misassociate labels with the wrong set intersection, directly reproducing the user's report that rendered diagrams are chaotic."

[acceptance]
description = "Implement deterministic collision-free region label placement: test candidate cells for membership in every requested set, avoid occupied spans, and draw a connector to a compact external callout when no in-region span fits. Text nodes must be placed in or connected to their region. Crop unused rows/columns or size from geometry. Add structural tests that reject overlapping label spans and verify each label point/connector against its set membership."
command = "cargo test --test semantic_integrity venn_labels_are_collision_free_and_region_associated -- --exact"
