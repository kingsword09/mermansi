created_at = "unix:1785495343"
objective = "Replace the structured-text-only Pie, Radar, QuadrantChart, and Venn outputs with genuine deterministic terminal chart geometry. Implement mermansi-native bounded Canvas geometry without modifying or forking merman-core, merman-ascii, Selkie, or any parser. Pie must draw a closed circular/radial chart with visible sector boundaries or proportional sector fill derived from every finite nonnegative section value, plus a compact legend preserving every label, value, percentage, title, and showData semantics; a bar/table alone is not acceptable. Radar must draw a shared center, radial axis spokes, graticule rings or polygons, and connected plotted curve vertices normalized from configured min/max while preserving every axis label, curve label/value, ticks, graticule choice, showLegend, and title. QuadrantChart must draw a closed Cartesian plotting area with midpoint cross-axes, all four quadrant labels in their actual regions, endpoint axis labels, and every point placed from its normalized x/y coordinates with deterministic collision-safe markers/callouts; preserve class and style metadata without pretending terminal color is geometry. Venn must draw closed overlapping set outlines for the semantic singleton sets, place intersection/subset and text labels in or connect them to their associated regions, preserve sizes, labels, styles, and arbitrary parsed subsets, and remain genuine geometry rather than a Subsets/Text Nodes list. For every family preserve Complete-mode canonical models, Concise-mode chart geometry with no structured-text fallback, ASCII and Unicode geometry, Chinese/CJK display widths, ANSI-independent geometry, determinism, control sanitization, and typed width/height/cell/byte/entity limits before allocations. Add strong tests for shape closure, proportional/coordinate placement, axis/spoke/curve connectivity, overlap identity, collision handling, empty/zero/invalid constructed models, bilingual fixtures, narrow widths, ASCII, determinism, and bounds. Update AGENTS.md, README.md, and docs/SUPPORT_MATRIX.md honestly. Apply KISS, YAGNI, DRY, and SOLID: reuse only minimal chart primitives that are genuinely shared."
open_issue_ids = ["task-0005-replace-the-structured-text-only-pie-rad#0001"]

[plan]
objective = "Replace the structured-text-only Pie, Radar, QuadrantChart, and Venn outputs with genuine deterministic terminal chart geometry. Implement mermansi-native bounded Canvas geometry without modifying or forking merman-core, merman-ascii, Selkie, or any parser. Pie must draw a closed circular/radial chart with visible sector boundaries or proportional sector fill derived from every finite nonnegative section value, plus a compact legend preserving every label, value, percentage, title, and showData semantics; a bar/table alone is not acceptable. Radar must draw a shared center, radial axis spokes, graticule rings or polygons, and connected plotted curve vertices normalized from configured min/max while preserving every axis label, curve label/value, ticks, graticule choice, showLegend, and title. QuadrantChart must draw a closed Cartesian plotting area with midpoint cross-axes, all four quadrant labels in their actual regions, endpoint axis labels, and every point placed from its normalized x/y coordinates with deterministic collision-safe markers/callouts; preserve class and style metadata without pretending terminal color is geometry. Venn must draw closed overlapping set outlines for the semantic singleton sets, place intersection/subset and text labels in or connect them to their associated regions, preserve sizes, labels, styles, and arbitrary parsed subsets, and remain genuine geometry rather than a Subsets/Text Nodes list. For every family preserve Complete-mode canonical models, Concise-mode chart geometry with no structured-text fallback, ASCII and Unicode geometry, Chinese/CJK display widths, ANSI-independent geometry, determinism, control sanitization, and typed width/height/cell/byte/entity limits before allocations. Add strong tests for shape closure, proportional/coordinate placement, axis/spoke/curve connectivity, overlap identity, collision handling, empty/zero/invalid constructed models, bilingual fixtures, narrow widths, ASCII, determinism, and bounds. Update AGENTS.md, README.md, and docs/SUPPORT_MATRIX.md honestly. Apply KISS, YAGNI, DRY, and SOLID: reuse only minimal chart primitives that are genuinely shared."

[[plan.steps]]
id = "step-1"
description = "Fix all 26 clippy errors in src/adapters/chart_primitives.rs (remove unused `outline_char`, `axis_char`, `plot_over` functions), src/adapters/pie.rs, src/adapters/radar.rs, src/adapters/quadrant_chart.rs, and src/adapters/venn.rs (replace manual `.min().max()` clamp patterns with `.clamp()`, replace manual `(x+1)/2` div_ceil with `usize::div_ceil(x, 2)`, remove unnecessary `as usize` casts). Run `cargo clippy --all-targets --all-features -- -D warnings` and confirm zero warnings."

[[plan.steps]]
id = "step-2"
description = """Fix the failing `venn_preserves_text_nodes` test in tests/semantic_integrity.rs: the test source `text A,B fullstack` is indented after a `union` statement, so merman-core's indented-text path uses the union's `current_sets` and treats `A,B fullstack` as trailing tokens. Change the test source to use correct indented syntax (`union A,B["APIs"]` followed by a further-indented `  text fullstack`) or use the explicit non-indented `text A,B fullstack` form at zero indent so the parser accepts it."""

[[plan.steps]]
id = "step-3"
description = "Add strong geometry tests to tests/semantic_integrity.rs: (a) Pie — assert the circle outline is closed (count fill+outline glyphs and verify the radial boundary spokes exist); (b) Radar — assert spoke connectivity from center, graticule ring presence, curve polygon closure when 3+ axes; (c) QuadrantChart — assert all four quadrant labels appear in the correct visual region relative to the midpoint cross, assert point marker placement corresponds to normalized coordinates, assert collision callout appears when two points share a cell; (d) Venn — assert overlap identity (two-set Venn has non-empty intersection region), assert set labels are placed inside their circles, assert styles legend preserves all style entries."

[[plan.steps]]
id = "step-4"
description = "Add constructed-model bounds and empty/zero/invalid tests to tests/bounds.rs: construct PieDiagramRenderModel / RadarDiagramRenderModel / QuadrantChartRenderModel / VennDiagramRenderModel directly via merman-core types with empty sections, zero-total values, invalid NaN/Inf values, empty axes/curves, empty subsets, and assert each produces nonempty deterministic output (no panic, no empty result) and that entity-limit checks fire with typed RenderLimit errors when exceeding MAX_CHART_ENTITIES."

[[plan.steps]]
id = "step-5"
description = "Update docs/SUPPORT_MATRIX.md: change the Pie, Radar, QuadrantChart, and Venn rows from 'Structured text' to their actual geometry level ('Circular sector geometry + legend', 'Radial spoke/graticule geometry + legend', 'Cartesian quadrant geometry + legend', 'Overlapping set-circle geometry + legend' respectively). Update the description paragraph that mentions Pie and Sankey as structured text."

[[plan.steps]]
id = "step-6"
description = "Update README.md: in the support/features section, note that Pie, Radar, QuadrantChart, and Venn now render genuine terminal chart geometry (not structured text). Update AGENTS.md architecture diagram text or module table if needed to reflect that Pie/Radar/QuadrantChart/Venn use chart_primitives geometry."

[[plan.steps]]
id = "step-7"
description = "Run the full acceptance command `cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-targets --all-features` and confirm all three pass with zero errors and zero test failures. Fix any remaining issues."
