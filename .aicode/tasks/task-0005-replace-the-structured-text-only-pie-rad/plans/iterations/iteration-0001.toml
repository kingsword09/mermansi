schema_version = 1
task = "task-0005-replace-the-structured-text-only-pie-rad"
iteration = 1
loop_iteration = 1
created_at = "unix:1785493983"
objective = "Replace the structured-text-only Pie, Radar, QuadrantChart, and Venn outputs with genuine deterministic terminal chart geometry. Implement mermansi-native bounded Canvas geometry without modifying or forking merman-core, merman-ascii, Selkie, or any parser. Pie must draw a closed circular/radial chart with visible sector boundaries or proportional sector fill derived from every finite nonnegative section value, plus a compact legend preserving every label, value, percentage, title, and showData semantics; a bar/table alone is not acceptable. Radar must draw a shared center, radial axis spokes, graticule rings or polygons, and connected plotted curve vertices normalized from configured min/max while preserving every axis label, curve label/value, ticks, graticule choice, showLegend, and title. QuadrantChart must draw a closed Cartesian plotting area with midpoint cross-axes, all four quadrant labels in their actual regions, endpoint axis labels, and every point placed from its normalized x/y coordinates with deterministic collision-safe markers/callouts; preserve class and style metadata without pretending terminal color is geometry. Venn must draw closed overlapping set outlines for the semantic singleton sets, place intersection/subset and text labels in or connect them to their associated regions, preserve sizes, labels, styles, and arbitrary parsed subsets, and remain genuine geometry rather than a Subsets/Text Nodes list. For every family preserve Complete-mode canonical models, Concise-mode chart geometry with no structured-text fallback, ASCII and Unicode geometry, Chinese/CJK display widths, ANSI-independent geometry, determinism, control sanitization, and typed width/height/cell/byte/entity limits before allocations. Add strong tests for shape closure, proportional/coordinate placement, axis/spoke/curve connectivity, overlap identity, collision handling, empty/zero/invalid constructed models, bilingual fixtures, narrow widths, ASCII, determinism, and bounds. Update AGENTS.md, README.md, and docs/SUPPORT_MATRIX.md honestly. Apply KISS, YAGNI, DRY, and SOLID: reuse only minimal chart primitives that are genuinely shared."
open_issue_ids = ["task-0005-replace-the-structured-text-only-pie-rad#0001"]

[plan]
objective = "Replace the structured-text-only Pie, Radar, QuadrantChart, and Venn outputs with genuine deterministic terminal chart geometry. Implement mermansi-native bounded Canvas geometry without modifying or forking merman-core, merman-ascii, Selkie, or any parser. Pie must draw a closed circular/radial chart with visible sector boundaries or proportional sector fill derived from every finite nonnegative section value, plus a compact legend preserving every label, value, percentage, title, and showData semantics; a bar/table alone is not acceptable. Radar must draw a shared center, radial axis spokes, graticule rings or polygons, and connected plotted curve vertices normalized from configured min/max while preserving every axis label, curve label/value, ticks, graticule choice, showLegend, and title. QuadrantChart must draw a closed Cartesian plotting area with midpoint cross-axes, all four quadrant labels in their actual regions, endpoint axis labels, and every point placed from its normalized x/y coordinates with deterministic collision-safe markers/callouts; preserve class and style metadata without pretending terminal color is geometry. Venn must draw closed overlapping set outlines for the semantic singleton sets, place intersection/subset and text labels in or connect them to their associated regions, preserve sizes, labels, styles, and arbitrary parsed subsets, and remain genuine geometry rather than a Subsets/Text Nodes list. For every family preserve Complete-mode canonical models, Concise-mode chart geometry with no structured-text fallback, ASCII and Unicode geometry, Chinese/CJK display widths, ANSI-independent geometry, determinism, control sanitization, and typed width/height/cell/byte/entity limits before allocations. Add strong tests for shape closure, proportional/coordinate placement, axis/spoke/curve connectivity, overlap identity, collision handling, empty/zero/invalid constructed models, bilingual fixtures, narrow widths, ASCII, determinism, and bounds. Update AGENTS.md, README.md, and docs/SUPPORT_MATRIX.md honestly. Apply KISS, YAGNI, DRY, and SOLID: reuse only minimal chart primitives that are genuinely shared."

[[plan.steps]]
id = "step-1"
description = "Create src/adapters/chart_primitives.rs: shared bounded chart primitives re-exported from src/adapters/mod.rs. Include display-column-aware midpoint circle outline + fill, Bresenham arbitrary-point line draw (grapheme fill, not axis-aligned merge_stroke), radial-line-from-center helper, charset-aware fill/outline char selection, a MAX_CHART_ENTITIES cap (4096), and per-operation canvas bounds checks returning typed MermansiError. These are the only genuinely shared primitives (DRY) — circle/line/radial — used by all four geometry adapters."

[[plan.steps]]
id = "step-2"
description = "Rewrite src/adapters/pie.rs to render a genuine closed circular/radial pie chart on a bounded Canvas: cap sections at MAX_CHART_ENTITIES before allocation; compute total of finite nonnegative values with explicit labeled nonempty fallback for empty/zero-total; allocate a bounded Canvas sized within opts.max_width/max_height; draw the closed circle outline; for each section draw a radial boundary spoke from center to perimeter at the cumulative proportional angle and fill the sector arc region with section-specific chars (Unicode block/solid, ASCII digits/#) so proportional fill is visible; render a compact legend preserving every label, value, percentage, title, and showData semantics aligned by str_display_width. No bar/table-only fallback."

[[plan.steps]]
id = "step-3"
description = "Rewrite src/adapters/radar.rs to render a genuine radar/spider chart on a bounded Canvas: cap axes and curves at MAX_CHART_ENTITIES; allocate bounded Canvas; draw a shared center; draw N radial axis spokes from center to perimeter at 2π·i/N; draw graticule as concentric circles (graticule=='circle') or connected polygons (graticule=='polygon') at ticks fractions of the radius; for each curve normalize entries using configured min/max (options.min/max if set else data-derived) to vertex positions along each spoke and connect consecutive vertices with Bresenham lines forming a closed polygon; place axis labels at spoke ends; honor showLegend, ticks, title; preserve every axis label, curve label, and value. Return canvas render plus optional legend as the preview."

[[plan.steps]]
id = "step-4"
description = "Rewrite src/adapters/quadrant_chart.rs to render a genuine Cartesian quadrant chart on a bounded Canvas: cap points at MAX_CHART_ENTITIES; allocate bounded Canvas; draw a closed box plotting-area border; draw midpoint cross-axes (horizontal line at vertical center, vertical line at horizontal center); place all four quadrant texts in their actual regions (Q1 top-right, Q2 top-left, Q3 bottom-left, Q4 bottom-right); place endpoint axis labels (x-left, x-right, y-bottom, y-top); for each point compute plotting position from normalized (x,y) inside the area, place a deterministic collision-safe marker, and on collision offset to an adjacent free cell or append a numbered callout list; preserve class and style metadata in a legend without pretending terminal color is geometry. Return canvas render plus point/class legend as the preview."

[[plan.steps]]
id = "step-5"
description = "Rewrite src/adapters/venn.rs to render genuine overlapping set outlines on a bounded Canvas: identify semantic singleton sets (subsets with sets.len()==1) and draw closed circle outlines for each arranged with controlled pairwise overlap (2 sets: two offset circles; 3: triangle; N: deterministic ring layout with bounded radii from sizes); for non-singleton subsets place labels in the geometric intersection region of involved sets or connect them via a Bresenham connector line to the nearest region; for text_nodes place the id (and label) in the region determined by its sets; preserve sizes (relative circle sizing), labels, styles (legend), and arbitrary parsed subsets. Return canvas render plus style/text legend as the preview — not a Subsets/Text Nodes list."

[[plan.steps]]
id = "step-6"
description = "Add strong tests in tests/semantic_integrity.rs and tests/bounds.rs covering: Pie shape closure (closed circle outline), proportional sector fill (larger value → more filled cells), label/value/percentage/title/showData preservation, empty and zero-total constructed models, CJK display-width alignment, ASCII and Unicode, determinism; Radar center presence, spoke count == axis count, graticule ring/polygon connectivity, closed plotted curve polygon, axis label and curve label/value preservation, min/max normalization, ticks/showLegend/title, determinism; QuadrantChart closed plotting area, midpoint cross-axes, four quadrant labels in correct regions, points placed from normalized coordinates, collision handling, class/style metadata preserved, ASCII, determinism; Venn closed overlapping set outlines, intersection labels in or connected to regions, subset/text preservation, sizes preserved, arbitrary subsets, determinism; bounds tests for narrow widths, entity cap enforcement, canvas cell limits, and output byte limits for all four families."

[[plan.steps]]
id = "step-7"
description = "Update documentation honestly: in docs/SUPPORT_MATRIX.md change the Support level for Pie, Radar, QuadrantChart, and Venn from 'Structured text' to 'Terminal chart geometry + canonical model' and update the closing Output guarantee paragraph; in README.md apply the same support-level change in the support matrix table; confirm AGENTS.md adapter dispatch description remains accurate (no structural change required). Do not claim SVG-coordinate parity; label summary output explicitly where exact browser geometry is not meaningful."

[[plan.steps]]
id = "step-8"
description = "Run focused verification checks: cargo fmt --check, cargo clippy --all-targets --all-features -- -D warnings, and cargo test --all-targets --all-features. Fix any compilation, lint, or test failures iteratively without running Git commands, staging, committing, resolving Issues, or marking the Task complete."
