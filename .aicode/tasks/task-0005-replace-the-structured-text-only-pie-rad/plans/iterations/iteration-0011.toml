[[plan.steps]]
id = "step-1"
description = "Derive a compact checked canvas from quadrant/axis display widths and point count; keep a closed box and midpoint axes, overlay points before collision-safe full-label placement, and crop outer margins."

[[plan.steps]]
id = "step-2"
description = "Validate finite normalized coordinates, explicitly classify non-finite/out-of-range/unplaced points, and place valid points deterministically with a bounded nearby search restricted to the plot interior."

[[plan.steps]]
id = "step-3"
description = "Detect coincident ideal cells independently of placement and always emit truthful overlap groups; preserve full quadrant/axis labels via fallback callouts and preserve point-local plus class styles through one shared formatter."

[[plan.steps]]
id = "step-4"
description = "Add an exact constructed-model test for compactness, closure, coordinate ordering, full labels, invalid/out-of-range points, coincident points, local/class styles, ASCII/Unicode, and determinism; visually inspect fixtures and run full verification."
