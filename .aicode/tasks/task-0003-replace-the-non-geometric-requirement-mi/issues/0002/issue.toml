[problem]
description = "The architecture boundary ASCII diagram in AGENTS.md (lines 28-33) still lists Mindmap and TreeView under the 'merman-ascii reuse' branch. The actual dispatch in src/adapters/mod.rs now routes both families through mermansi's own structured terminal adapters (render_mindmap, render_treeview) using BoxLayout::Layered, not through merman-ascii. The diagram is now stale relative to the implemented architecture."
impact = "No functional impact — the code dispatches correctly. Minor documentation inconsistency: a developer reading AGENTS.md would expect merman-ascii to render Mindmap/TreeView, but the actual implementation uses mermansi adapters."

[acceptance]
description = "Update the AGENTS.md architecture boundary diagram to move Mindmap and TreeView from the 'merman-ascii reuse' list to the 'mermansi structured terminal adapters' list, reflecting the actual dispatch in src/adapters/mod.rs."
