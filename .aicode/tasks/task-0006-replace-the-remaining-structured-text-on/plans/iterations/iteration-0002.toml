UPPORT_MATRIX.md honestly. Do not modify or fork merman-core, merman-ascii, Selkie, or any parser. Apply KISS, YAGNI, DRY, and SOLID; reuse existing Canvas/box/chart primitives only when behavior is genuinely shared."

