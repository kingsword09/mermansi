[location]
path = "src/adapters/journey.rs"
line = 141

[problem]
description = "Both adapters map every section, task, period, and event to a separate node rank in a vertical BoxDiagram. Representative fixtures consume 53 and 42 rows while using only 21 columns, leaving most of a 95-column terminal unused."
impact = "Common diagrams require excessive scrolling and appear sparse rather than providing a scannable terminal overview."

[acceptance]
description = "Use a compact ordered layout that consumes available width while preserving sequence, section/task association, actors, scores, events, closed nodes, and connected progression in ASCII and Unicode. The representative 95-column Journey and Timeline fixtures must each fit within 30 rows."
command = "cargo test --test semantic_integrity journey_and_timeline_fit_compact_terminal_height -- --exact"

[resolution]
review = "../../reviews/iteration-0006.json"
description = "Resolved by using the shared width-aware packed layout with left-to-right chain edges. The 100-column ASG fixtures dropped from 55/44 rows to 19/15 rows while preserving every node, label, score, actor, event, and directed connection."
