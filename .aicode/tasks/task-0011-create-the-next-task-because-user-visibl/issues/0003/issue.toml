[problem]
description = "Pie and Radar use the same coordinate radius on both axes even though terminal cells are approximately twice as tall as they are wide. Their ASG renders therefore appear as narrow vertical columns instead of circular or balanced radial charts."
impact = "The primary geometry is materially distorted and difficult to interpret despite satisfying glyph-presence tests."

[acceptance]
description = "Introduce one shared, explicit character-cell aspect transform for radial chart coordinates. Pie must appear circular and Radar balanced in the real ASG terminal while preserving values, ticks, labels, bounds, determinism, and ASCII/Unicode behavior. Add coordinate-level aspect assertions that fail on the current narrow geometry."
command = "cargo test --test semantic_integrity radial_charts_compensate_terminal_cell_aspect_ratio -- --exact"

[resolution]
review = "../../reviews/iteration-0003.json"
description = "Resolved by the shared 2:1 radial projection, complete Pie/Radar integration, coordinate and output aspect tests, full verification, and ASG visual inspection."
