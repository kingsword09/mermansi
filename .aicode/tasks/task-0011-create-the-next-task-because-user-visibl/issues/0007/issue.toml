[problem]
description = "The delegated ER renderer stacks raw cardinality fragments such as '||', 'o{', and '|{' around relationship labels on a narrow vertical line. In the ASG image they read like detached text rather than endpoint markers connected to specific entities."
impact = "Users cannot confidently read relationship direction or cardinality from the terminal diagram, undermining the purpose of an ER preview."

[acceptance]
description = "Render each ER relationship as a connected route with unambiguous endpoint cardinality markers and a readable label, while preserving every entity, attribute, relationship, direction, bounds, determinism, and ASCII/Unicode output. Add structural assertions that associate both markers and label with the same route."
command = "cargo test --test semantic_integrity er_relationships_connect_cardinalities_and_labels -- --exact"
