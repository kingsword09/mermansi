path = "src/adapters/venn.rs"
line = 104

[problem]
description = "Region placement checks that label cells are empty but does not require clearance from adjacent outline glyphs. The three-set fixture places labels and dense intersection text directly against circle outlines, making boundaries and labels run together in ASG output."
impact = "The diagram is technically non-overlapping but remains visually ambiguous, especially for pairwise and three-way intersections."

[acceptance]
description = "Require deterministic clearance around in-region labels or use connected callouts when clearance is unavailable. Preserve exact region association, every label and intersection, compact bounds, and both charsets. Add structural tests that reject outline glyphs immediately adjacent to label spans."
command = "cargo test --test semantic_integrity venn_labels_keep_outline_clearance -- --exact"

[resolution]
review = "../../reviews/iteration-0004.json"
description = "Resolved by two-dimensional label clearance, deterministic region callouts, exact ASCII/Unicode tests, full verification, and ASG visual inspection."
