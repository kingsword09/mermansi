[[plan.steps]]
id = "step-1"
description = 'Add a comprehensive sanitize_label_text function in src/ansi.rs that removes complete CSI sequences, string-control families (OSC/DCS/APC/PM/SOS) terminated by BEL or ST (ESC \), and C0 controls (BEL and other 0x00-0x1f except common whitespace \t/\n/\r). Keep the existing strip_ansi unchanged as the Plain-mode defensive boundary.'

[[plan.steps]]
id = "step-2"
description = "Call sanitize_label_text on each section.label inside render_pie (src/adapters/pie.rs) before it is used in the format! macro for width calculation and column alignment, so no raw control bytes affect Pie geometry in any color mode."

[[plan.steps]]
id = "step-3"
description = 'Fix the Clippy useless_format warning in tests/semantic_integrity.rs line 404 (format!("...") with no args → use .to_string()).'

[[plan.steps]]
id = "step-4"
description = "Replace/expand the two existing pie ANSI-leak tests in tests/semantic_integrity.rs with focused regression coverage: (a) label text survives sanitization in Plain mode, (b) zero ESC/0x07 bytes in Plain output, (c) Value column alignment for a sanitized label matches alignment for a clean label of the same visible text, (d) Ansi16 and TrueColor modes also cannot pass through user-supplied CSI/OSC/BEL sequences in the label row."

[[plan.steps]]
id = "step-5"
description = "Run cargo clippy --all-targets, cargo test --test semantic_integrity, and the full test suite to verify the fix; clean only generated Cargo artifacts if the target cache is stale."
