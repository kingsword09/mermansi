[[plan.steps]]
id = "step-1"
description = "Fix clippy collapsible_if violation in src/canvas.rs set_char method (collapse nested if into compound condition or use early-return pattern)."

[[plan.steps]]
id = "step-2"
description = "Fix the failing render_no_diagram test in src/lib.rs: 'hello world' causes merman-core to return a DetectType parse error, so the test should either use an input that yields None (no diagram) or expect the parse error path."

[[plan.steps]]
id = "step-3"
description = "Create all English and Chinese Mermaid fixture files in tests/fixtures/ — one .en.mmd and one .zh.mmd per family (flowchart, sequence, state, class, er, packet, treeview, xychart, mindmap, gantt, gitgraph, journey, kanban, timeline, zenumml, json, architecture, c4, pie, requirement, sankey, radar, info, treemap, block, quadrant, ishikawa, eventmodeling, venn)."

[[plan.steps]]
id = "step-4"
description = "Create tests/support_matrix.rs: an executable conformance test that iterates every RenderSemanticModel variant, parses each English and Chinese fixture, asserts nonempty deterministic output for both ASCII and Unicode options, and verifies byte-identical output on repeated render."

[[plan.steps]]
id = "step-5"
description = "Create tests/semantic_integrity.rs: tests that verify label preservation (English, Chinese, combining-mark, emoji), box closure, edge endpoint and marker retention, direction handling (TD/TB/BT/LR/RL), self-relations, cycles, disconnected components, and nested groups using flowchart fixtures."

[[plan.steps]]
id = "step-6"
description = "Create tests/bounds.rs: tests for bounded allocations (source size limit, canvas cell limit, invalid options), typed error returns, and determinism (repeated render produces identical bytes)."

[[plan.steps]]
id = "step-7"
description = "Run full verification: cargo fmt, cargo fmt --check, cargo clippy --all-targets --all-features -- -D warnings, cargo test --all-targets --all-features, cargo package --locked. Fix any remaining issues."

[[plan.steps]]
id = "step-8"
description = "Create the initial Conventional Commit with all reviewed work, using message 'feat: complete mermansi terminal renderer with full support matrix, tests, and fixtures'."
