[[plan.steps]]
id = "step-1"
description = 'Scaffold the Cargo workspace: create root Cargo.toml (workspace with library crate `mermansi` and binary `mermansi-cli`), pin `rust-version = "1.95"` and add a `rust-toolchain.toml` that selects the 1.97.1 host toolchain (satisfies MSRV), add dependencies on merman-core 0.8.0-alpha.3 (default-features=false, features=["full","host"]) and merman-ascii 0.8.0-alpha.3, plus dev-deps. Set resolver = "2".'

[[plan.steps]]
id = "step-2"
description = "Create foundational docs before broad implementation: AGENTS.md (architecture boundaries: parser integration → semantic adapters → canvas → ANSI → CLI → tests; KISS/YAGNI/DRY/SOLID; license declarations: merman-core/merman-ascii = MIT OR Apache-2.0 used as dependencies, beautiful-mermaid = MIT prior-art-only algorithmic reference, mermansi itself = MIT OR Apache-2.0), README.md (overview, install, CLI usage, library API, support matrix summary, deterministic-output guarantee), docs/ROADMAP.md (phased TODO list with measurable gates), docs/SUPPORT_MATRIX.md (one row per RenderSemanticModel variant: family, parser aliases, support level, renderer strategy [merman-ascii-reuse vs mermansi-adapter], English fixture path, Chinese fixture path, status)."

[[plan.steps]]
id = "step-3"
description = "Implement the error module (`src/error.rs`): typed `MermansiError` enum with variants for ParseError (wrapping merman-core::Error), UnsupportedFamily, RenderLimit { actual, limit, context }, InvalidOption { field, message }, CanvasOverflow { requested, max }, and a `Result<T>` alias. Derive thiserror::Error with Display. No panics anywhere."

[[plan.steps]]
id = "step-4"
description = "Implement the display-column-aware bounded canvas (`src/canvas.rs`): a Canvas struct with width/height/cells, using unicode-width for display-column accounting, grapheme-cluster-aware label placement (at minimum: single-codepoint + combining-mark handling, CJK wide-char width=2, emoji width=2), continuation cells for wide characters, atomic overwrite with priority (borders > text > strokes > blank), deterministic routing helpers (horizontal/vertical/diagonal stroke placement with corner merging), and a hard cell-budget guard returning CanvasOverflow. Include char-display-width and label-width utility functions."

[[plan.steps]]
id = "step-5"
description = "Implement the public options module (`src/options.rs`): `MermansiOptions` with charset (Ascii/Unicode), color mode (Plain/Ansi16/TrueColor), max width/height, and ANSI-role toggle. Default = Unicode + Plain + no ANSI. Builder methods. Validate() returning typed errors for invalid dimensions."

[[plan.steps]]
id = "step-6"
description = "Implement the ANSI encoding module (`src/ansi.rs`): an optional ANSI role system (NodeBorder, NodeText, EdgeStroke, EdgeArrow, EdgeLabel, ChartSeries(n), SectionHeader, etc.) that maps to SGR escape sequences. When color_mode=Plain, emit no escape codes (geometry unaffected). When TrueColor, map roles to RGB. Ensure ANSI never changes cell geometry — only adds escape prefixes/suffixes."

[[plan.steps]]
id = "step-7"
description = "Implement the semantic adapter dispatch module (`src/adapters/mod.rs`): define a `render_model(model: &RenderSemanticModel, opts: &MermansiOptions) -> Result<String>` function that dispatches each RenderSemanticModel variant. For families already covered by merman-ascii (Class, Er, Flowchart, Gantt, GitGraph, Journey, Kanban, Mindmap, Packet, Sequence, State, Timeline, TreeView, XyChart): delegate to merman-ascii::render_model via an adapter that converts MermansiOptions→AsciiRenderOptions and maps AsciiError→MermansiError. For remaining families (Json, Architecture, C4, Pie, Requirement, Sankey, Radar, Info, Treemap, Block, QuadrantChart, GitGraph-separate-check, Ishikawa, EventModeling, Venn): route to mermansi's own adapter modules."

[[plan.steps]]
id = "step-8"
description = "Implement structured-terminal adapters for each non-merman-ascii family, one module per family under `src/adapters/`: json.rs (render the JSON value as a readable indented block or a summary tree), architecture.rs (nodes + edges as boxed nodes with routed connectors), c4.rs (C4 entities and relationships as structured boxes with typed labels), pie.rs (pie slices as a proportional bar/summary with values and percentages), requirement.rs (requirement elements with type/id/text/done rows), sankey.rs (source→target flows with value-weighted summary), radar.rs (axes and series values in a structured polar-text table), info.rs (title and config info block), treemap.rs (hierarchical node values as indented weighted outline), block.rs (block nodes and edges as boxed graph), quadrant_chart.rs (four quadrants with plotted points textually), ishikawa.rs (spine + branch/bone hierarchy), eventmodeling.rs (events and sequences as structured timeline), venn.rs (sets and intersections as labeled overlap summary). Each adapter must preserve all parsed entities, labels, and values; none may silently drop semantic data; each produces deterministic nonempty output for both ASCII and Unicode charsets."

[[plan.steps]]
id = "step-9"
description = "Implement the public source-to-text API (`src/lib.rs`): `pub fn render_source(mermaid_text: &str, opts: &MermansiOptions) -> Result<String>` — uses merman_core::Engine to parse_diagram_for_render_model_sync with ParseOptions::strict(), then dispatches to adapters::render_model. Also expose `pub fn render_model(model: &RenderSemanticModel, opts: &MermansiOptions) -> Result<String>`, `pub fn render_source_ascii(mermaid_text: &str) -> Result<String>` and `pub fn render_source_unicode(mermaid_text: &str) -> Result<String>` convenience functions. Re-export key types. Document the deterministic-output contract."

[[plan.steps]]
id = "step-10"
description = "Implement the CLI binary (`src/bin/mermansi.rs` or separate `mermansi-cli` crate): read Mermaid source from stdin or --file, flags --ascii/--unicode (charset), --color/--no-color, --width N, parse via the library API, print rendered text to stdout. Exit codes: 0 success, 1 parse error (message to stderr), 2 render error, 3 invalid options. Include --version and --help."

[[plan.steps]]
id = "step-11"
description = "Create semantic test fixtures: `tests/fixtures/` with one English and one Chinese .mmd file per family (all 29 RenderSemanticModel variants including aliases graph/flowchart, classDiagram/class, stateDiagram/state, erDiagram/er, zenuml). Each fixture must be valid Mermaid that merman-core parses successfully into the corresponding RenderSemanticModel variant."

[[plan.steps]]
id = "step-12"
description = "Implement the executable support-matrix conformance test (`tests/support_matrix.rs`): a data-driven test that iterates a static SUPPORT_MATRIX table (family_id, parser_aliases, fixture_en, fixture_zh, expected_model_kind), asserts every fixture parses without error, asserts the resulting RenderSemanticModel kind matches expectations, asserts render_source produces nonempty deterministic output for both ASCII and Unicode, and asserts that rendering twice yields identical bytes (determinism). Also asserts every RenderSemanticModel variant from the issue's authoritative list (Json, Mindmap, State, Sequence, Flowchart, Architecture, Class, C4, Kanban, Gantt, Pie, Packet, Timeline, Journey, Requirement, Sankey, Radar, Info, Treemap, Block, Er, QuadrantChart, XyChart, GitGraph, TreeView, Ishikawa, EventModeling, Venn) is represented in the matrix. Fail if any upstream variant is missing."

[[plan.steps]]
id = "step-13"
description = "Implement semantic-preservation tests (`tests/semantic_integrity.rs`): for flowchart families test TD/TB/BT/LR/RL directions, self-relations, cycles, disconnected components, nested groups (subgraphs), parallel edges, dense edges — assert key labels appear in output and boxes close (border characters form rectangles). For Chinese/CJK labels assert display-width is correct (no broken alignment). For emoji labels assert width=2 cells. For combining-mark labels assert base+combining stays together."

[[plan.steps]]
id = "step-14"
description = "Implement bounded-allocation and determinism tests (`tests/bounds.rs`): assert that CanvasOverflow is returned when cell budget is exceeded, assert that invalid options return typed errors, assert that rendering the same input N times yields byte-identical output, and assert no panic on edge cases (empty diagram, single-node, very long labels)."

[[plan.steps]]
id = "step-15"
description = "Run full verification suite: cargo fmt, cargo fmt --check, cargo clippy --all-targets --all-features -- -D warnings (fix all findings), cargo test --all-targets --all-features (all green), cargo package --locked (succeeds). Fix any failures iteratively. Update docs/SUPPORT_MATRIX.md status column to reflect verified results."

[[plan.steps]]
id = "step-16"
description = "Create a Conventional Commit for the complete reviewed work unit: `feat: implement mermansi terminal renderer library and CLI for Mermaid`. Commit all source, tests, fixtures, and docs in one atomic commit with a message body summarizing architecture, supported families, and verification results."
