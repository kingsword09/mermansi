[[plan.steps]]
id = "step-1"
description = "In src/ansi.rs, fix sanitize_label_text's string-control family (OSC/DCS/APC/PM/SOS) loop: when an embedded ESC is encountered inside the loop, check whether the next byte is backslash (ST terminator). If ST, consume it and break. If not ST, continue consuming (embedded non-terminating ESC bytes must not terminate the string-control family)."

[[plan.steps]]
id = "step-2"
description = 'In src/ansi.rs, change the C0-control handling so TAB (\t), LF (\n), and CR (\r) are also removed (or normalized to space) rather than preserved, since they are layout-changing control characters that can break Pie column alignment and the table format.'

[[plan.steps]]
id = "step-3"
description = "In src/ansi.rs, make sanitize_label_text pub(crate) instead of pub, since only the Pie adapter uses it and no public API exposure is required."

[[plan.steps]]
id = "step-4"
description = "In src/ansi.rs, correct the doc comment on sanitize_label_text that currently claims it is 'called in every adapter' — it is called only by the Pie adapter."

[[plan.steps]]
id = "step-5"
description = "Update the unit test sanitize_preserves_tab_newline_cr in src/ansi.rs to reflect the new behavior (TAB/LF/CR are stripped, not preserved), and add a unit test for embedded non-terminating ESC inside an OSC string-control family (e.g., ESC ]0;T ESC [31m More BEL must be fully consumed)."

[[plan.steps]]
id = "step-6"
description = '''In tests/semantic_integrity.rs, strengthen pie_label_no_control_bytes_in_ansi16_mode and pie_label_no_control_bytes_in_truecolor_mode to assert the exact user-supplied CSI (\u{1b}[31m) and OSC prefix (\u{1b}]0;X) sequences are absent from output, while the renderer's own ANSI roles (ESC bytes from the encoder) remain present. Keep the visible-label and Value-column alignment tests intact.'''

[[plan.steps]]
id = "step-7"
description = "Run cargo test --test semantic_integrity and cargo clippy --all-targets -- -D warnings to verify all focused tests pass with no warnings."
