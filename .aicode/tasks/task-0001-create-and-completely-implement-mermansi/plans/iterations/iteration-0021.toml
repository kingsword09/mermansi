[[plan.steps]]
id = "step-1"
description = "Confirm the crate-private sanitize_label_text helper in src/ansi.rs is complete: it must remove CSI (ESC [) sequences, consume OSC/DCS/APC/PM/SOS string-control families through embedded non-terminating ESC bytes stopping only at BEL (0x07) or ST (ESC backslash), and strip all C0/C1 control characters including TAB, LF, and CR before any formatting or width calculation."

[[plan.steps]]
id = "step-2"
description = "Confirm src/adapters/pie.rs calls sanitize_label_text on section.label before format!, so sanitization precedes the {:<30} width calculation and Value/Share column formatting for every ColorMode (Plain, Ansi16, TrueColor)."

[[plan.steps]]
id = "step-3"
description = "Verify the doc comment on sanitize_label_text accurately states it is currently called only by the Pie adapter (not every adapter), and that the helper is pub(crate) — no public API surface is added unless genuinely required."

[[plan.steps]]
id = "step-4"
description = "Confirm the regression tests in tests/semantic_integrity.rs cover: zero ESC/BEL bytes in Plain output for a Pie label with embedded CSI+OSC+BEL; visible label text 'Red' survives; Value-column byte offset is identical for dirty vs clean labels; ST-terminated OSC stripped; DCS stripped in Plain/Ansi16/TrueColor; and in Ansi16/TrueColor the exact user-supplied CSI [31m and OSC ]0;X are absent while renderer's own ANSI roles remain present."

[[plan.steps]]
id = "step-5"
description = "Run cargo clean, then cargo test --test semantic_integrity and cargo clippy --all-targets -- -D warnings from a clean build; all must pass with zero warnings."
