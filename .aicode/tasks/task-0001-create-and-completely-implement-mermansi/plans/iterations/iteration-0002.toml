[[plan.steps]]
id = "step-1"
description = "Fix src/adapters/mod.rs: remove invalid `use crate::canvas::{Charset}`, use `crate::options::Charset` for both; replace AsciiRenderOptions struct expression with AsciiRenderOptions::default().with_max_grid_cells(...).with_color_mode(...) builder calls; remove unused canvas_charset import alias."

[[plan.steps]]
id = "step-2"
description = "Fix src/adapters/c4.rs: rewrite format_boundary to use actual C4BoundaryRenderModel fields (alias, ty: Option<C4Text>, label: C4Text); C4 boundaries have no children/shapes arrays, so emit flat boundary listing and relationships."

[[plan.steps]]
id = "step-3"
description = "Fix src/adapters/ishikawa.rs: resolve if/else type mismatch by making both branches String (use .to_string() or format!)."

[[plan.steps]]
id = "step-4"
description = "Fix src/adapters/requirement.rs: remove unused `mut` on format_element's out variable."

[[plan.steps]]
id = "step-5"
description = "Create tests/fixtures/ directory with English and Chinese .mmd fixtures for all 28+ families (flowchart, sequence, state, class, er, packet, treeview, xychart, mindmap, gantt, gitgraph, journey, kanban, timeline, zenuml, json, architecture, c4, pie, requirement, sankey, radar, info, treemap, block, quadrant, ishikawa, eventmodeling, venn)."

[[plan.steps]]
id = "step-6"
description = "Create tests/support_matrix.rs: executable conformance test that iterates all RenderSemanticModel variants, parses each fixture, and asserts nonempty deterministic ASCII + Unicode output."

[[plan.steps]]
id = "step-7"
description = "Create tests/semantic_integrity.rs: label preservation, box closure, direction tests for flowchart families delegated to merman-ascii."

[[plan.steps]]
id = "step-8"
description = "Create tests/bounds.rs: bounded allocation, determinism (byte-identical), and typed-error tests."

[[plan.steps]]
id = "step-9"
description = "Run cargo fmt --check, fix any formatting; run cargo clippy --all-targets --all-features -- -D warnings, fix all lints; run cargo test --all-targets --all-features; run cargo package --locked; resolve any remaining failures."
