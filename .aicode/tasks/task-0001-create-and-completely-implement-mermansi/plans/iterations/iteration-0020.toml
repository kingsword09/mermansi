[[plan.steps]]
id = "step-1"
description = 'Verify sanitize_label_text in src/ansi.rs is pub(crate) and handles: CSI (ESC [ ... final 0x40..=0x7e), string-control families (OSC ESC ], DCS ESC P, APC ESC _, PM ESC ^, SOS ESC X) consuming through embedded non-terminating ESC bytes and stopping only at BEL (0x07) or ST (ESC \), and all C0/DEL/C1 controls including TAB/LF/CR via ch.is_control().'

[[plan.steps]]
id = "step-2"
description = "Verify the Pie adapter (src/adapters/pie.rs) calls sanitize_label_text before the format! width-calculation line for every ColorMode, with an accurate comment noting it is the primary defense layer and is currently called only by the Pie adapter."

[[plan.steps]]
id = "step-3"
description = "Correct any doc/comment in src/ansi.rs or src/adapters/pie.rs that inaccurately claims every adapter calls sanitize_label_text; confirm it says 'Currently called only by the Pie adapter'."

[[plan.steps]]
id = "step-4"
description = '''Verify integration tests in tests/semantic_integrity.rs: (a) Plain-mode output has zero ESC and zero BEL bytes, (b) visible label text survives, (c) Value-column offset is identical for sanitized vs clean labels, (d) Ansi16 and TrueColor modes assert the exact user-supplied CSI \x1b[31m and OSC \x1b]0;X are absent while renderer's own ESC count > 0 and BEL count == 0, (e) ST-terminated OSC is stripped in Plain mode.'''

[[plan.steps]]
id = "step-5"
description = "Run cargo test --test semantic_integrity and cargo clippy --all-targets -- -D warnings after cargo clean; confirm all pass with zero warnings."
