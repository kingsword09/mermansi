[location]
path = "src/output.rs"
line = 115

[problem]
description = "When a Pie label contains raw ESC CSI bytes, --no-color emits them verbatim into the final text output. The bounded-writer / AnsiEncoder path does not strip or neutralize literal escape sequences embedded in semantic label text before serializing to plain text, so --no-color is not truly color-free."
impact = "Rule 6 (ANSI roles do not affect geometry / --no-color must be plain text) is violated. Consumers parsing the plain-text output may encounter uncontrolled terminal-control bytes, breaking determinism and downstream consumers."

[acceptance]
description = "Strip or neutralize all literal ANSI escape sequences from label text before it reaches the final output when --no-color is active; add a regression test asserting no ESC (0x1b) bytes appear in --no-color output for a Pie diagram whose label contains an embedded CSI sequence."
command = "cargo test --test semantic_integrity"

[resolution]
review = "../../reviews/iteration-0024.json"
description = "Verified the terminal-bound Pie label sanitizer before width/layout, complete control-sequence handling, colored-mode isolation, visible-text preservation, alignment invariance, and passing host verification."
