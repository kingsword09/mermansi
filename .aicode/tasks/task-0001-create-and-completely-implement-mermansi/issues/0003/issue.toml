path = "src/adapters/block.rs"
line = 12

[problem]
description = "The Block adapter iterates over every blocks_flat entry and then recursively walks children, causing nested nodes (e.g. A/B/C) to be printed multiple times. The flat list already contains the full tree, so the additional recursive traversal double-counts."
impact = "Rule 4 (no family may silently drop or duplicate parsed semantic entities) is violated by over-emission rather than drops; output is misleading and not a faithful representation of the hierarchy."

[acceptance]
description = "Walk the hierarchy exactly once — either iterate the flat list or recurse the tree, not both — so that each Block node appears precisely once in the rendered output. Add a test with a three-level nested sample asserting single emission of each node."
command = "cargo test --test semantic_integrity"
