line = 21

[problem]
description = "cargo metadata reports merman-core and merman-ascii as caret ranges (^0.8.0-alpha.3) rather than exact version pins (=0.8.0-alpha.3). Pre-release caret ranges allow semver-compatible updates within the alpha series, which can pull a different alpha patch and break determinism."
impact = "Rule 8 (determinism) and reproducibility are at risk because a future 0.8.0-alpha.x could change parsing or rendering behavior between builds."

[acceptance]
description = "Pin merman-core and merman-ascii to exact versions (=0.8.0-alpha.3) in Cargo.toml and update Cargo.lock accordingly so builds are fully reproducible."
command = "cargo metadata --format-version 1 | grep merman"
