[problem]
description = "A flowchart decision (rhombus) node renders as a duplicated set of rounded borders — the output contains two overlapping box-drawing frames beginning with lines '╭────────╮', '╭        ╮', '< Is it? >'. The merged-stroke logic overwrites the rhombus corners with a second rectangular frame rather than rendering one clean border."
