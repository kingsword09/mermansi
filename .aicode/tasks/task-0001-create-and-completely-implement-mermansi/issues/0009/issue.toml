review = "../../reviews/iteration-0016.json"

[location]
path = "src/adapters/pie.rs"
line = 26

[problem]
description = "Mixed ASCII/CJK Pie rows differ by one display column and Sankey rows differ by up to three columns because Rust's scalar-width string formatting (chars().count) is used instead of Unicode display width. CJK characters occupy two display columns but are counted as one scalar, breaking column alignment."
impact = "Rule 5 (display-column-aware geometry) is violated; labels with CJK characters produce visually misaligned columns."

[acceptance]
description = "Use Unicode display width (not scalar count) for column padding in Pie and Sankey adapters so mixed ASCII/CJK rows align correctly. Add tests comparing column alignment for mixed-language label rows."
command = "cargo test --test semantic_integrity"

[resolution]
review = "../../reviews/iteration-0043.json"
description = "Verified display-column-aware, dynamically sized Pie and Sankey tables after terminal-safe text preparation, mixed ASCII/CJK alignment in both charsets, preserved values and canonical models, and passing host verification."
