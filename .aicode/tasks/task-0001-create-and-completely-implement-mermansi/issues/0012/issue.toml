[problem]
description = "cargo package --locked --allow-dirty --list includes every tracked .aicode task ledger, Issue, immutable iteration plan, and Review artifact. The package has grown to more than 160 files and carries internal workflow history unrelated to the mermansi library or CLI."
impact = "The production crate is unnecessarily inflated and exposes internal development records to downstream users. The Task release gate cannot be considered clean while non-product workflow state is shipped."

[acceptance]
description = "Exclude .aicode/ from the Cargo package without excluding required source, documentation, fixtures, licenses, or manifests. Verify cargo package --locked --allow-dirty --list contains no .aicode path and cargo package --locked --allow-dirty still succeeds."
command = "cargo package --locked --allow-dirty --list"
