[problem]
description = "No adapter imports or calls the mermansi Canvas; only the structured semantic header uses AnsiEncoder. The set_styled_text helper applies styling to only the first text owner, leaving subsequent owners unstyled. The display-column-aware bounded Canvas that supports grapheme segmentation, Unicode width, continuation cells, merged strokes, and atomic overwrite is unused by every per-family adapter."
impact = "Rule 5, Rule 6, and Rule 7 are violated — adapters bypass the bounded, display-column-aware Canvas and produce geometry that does not benefit from the core rendering infrastructure. ANSI styling is incomplete."

[acceptance]
description = "Route adapter text rendering through the display-column-aware Canvas and ensure set_styled_text applies to all text owners. Add tests confirming Canvas-based rendering and multi-owner ANSI styling."
command = "cargo test --test bounds"

[resolution]
review = "../../reviews/iteration-0042.json"
description = "Verified Canvas-backed adapter rendering, semantic ANSI roles on every grapheme owner including CJK/emoji/combining cases, preserved continuation ownership and plain geometry, pre-layout terminal-control sanitization, and passing host verification."
